# Production Docker setup for MangaDen
# Frontend deploys to Vercel separately
# Backend runs in Docker with Supabase (PostgreSQL) and Upstash (Redis)

services:
    backend:
        build:
            context: .
            dockerfile: docker/Dockerfile.backend
        container_name: mangaden-backend
        restart: unless-stopped
        ports:
            - "3000:3000"
        environment:
            - NODE_ENV=production
            - PORT=3000
        env_file:
            - backend/.env
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 40s
