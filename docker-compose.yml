# Production Docker setup for MangaDen
# Frontend deploys to Vercel separately
# Backend runs in Docker behind Caddy reverse proxy

services:
    mangaden-backend:
        build:
            context: .
            dockerfile: docker/Dockerfile.backend
        container_name: mangaden-backend
        restart: unless-stopped
        ports:
            - "127.0.0.1:3000:3000"
        environment:
            - NODE_ENV=production
            - PORT=3000
        env_file:
            - backend/.env.production
        healthcheck:
            test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/health"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 40s
        networks:
            - apps-network

    mangaden-frontend:
        build:
            context: .
            dockerfile: docker/Dockerfile.frontend_v2
        container_name: mangaden-frontend
        restart: unless-stopped
        ports:
            - "127.0.0.1:3001:3000"
        environment:
            - NODE_ENV=production
            - NEXT_PUBLIC_API_URL=http://localhost:3000
        networks:
            - apps-network

networks:
    apps-network:
        external: true
