# Production Docker setup for MangaDen API
# Frontend deploys to Vercel separately
# Uses Supabase (PostgreSQL) and Upstash (Redis)

services:
    api:
        build:
            context: .
            dockerfile: apps/api/Dockerfile
        container_name: mangaden-api
        restart: unless-stopped
        ports:
            - "3000:3000"
        environment:
            - NODE_ENV=production
            - PORT=3000
        env_file:
            - apps/api/.env
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 40s
